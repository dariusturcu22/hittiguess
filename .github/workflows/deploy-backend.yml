name: Deploy backend

on:
  push:
    branches: [dev]
    paths:
      - backend/**
      - ai/**
      - .github/workflows/deploy-backend.yml
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CORE_IMAGE: ghcr.io/${{ github.repository_owner }}/hittiguess-core
  AI_IMAGE: ghcr.io/${{ github.repository_owner }}/hittiguess-ai
  AZURE_RESOURCE_GROUP: hittiguess-rg
  CORE_APP_NAME: hittiguess-core
  AI_APP_NAME: hittiguess-ai

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: [smoke-test-core-image.sh, smoke-test-ai-image.sh]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/${{ matrix.script }}

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: backend
            image: ghcr.io/${{ github.repository_owner }}/hittiguess-core
          - context: ai
            image: ghcr.io/${{ github.repository_owner }}/hittiguess-ai
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}

  deploy:
    needs: publish
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the AI service
        run: >
          az containerapp update
          --name "$AI_APP_NAME"
          --resource-group "$AZURE_RESOURCE_GROUP"
          --image "$AI_IMAGE:${{ github.sha }}"
      - name: Deploy the core service
        run: >
          az containerapp update
          --name "$CORE_APP_NAME"
          --resource-group "$AZURE_RESOURCE_GROUP"
          --image "$CORE_IMAGE:${{ github.sha }}"
