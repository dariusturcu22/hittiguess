<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6c7086; }
    .navicon.active { background: #cba6f7; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); color: #11111b; }
    .divider { width: 32px; height: 2px; background: #313244; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .btn-yt { width: 100%; text-align: center; background: #fab387; color: #1e1e2e; font-family: 'Bungee', sans-serif; font-size: 14px; padding: 14px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 9px; }
    .btn-secondary-half { flex: 1; text-align: center; background: #1e1e2e; color: #cdd6f4; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; padding: 12px 0; border-radius: 100px; border: 2px solid #45475a; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-ghost-red-half { flex: 1; text-align: center; background: transparent; color: #e78284; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; padding: 12px 0; border-radius: 100px; border: 2px solid #45475a; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .game-card { width: 320px; height: 320px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; padding: 24px; text-align: center; border-radius: 40px; border: 8px solid #11111b; box-shadow: 9px 9px 0 rgba(0,0,0,0.4); }
    .game-card .artist { font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .game-card .year { font-family: 'Bungee', sans-serif; font-size: 76px; line-height: 1; }
    .game-card .title { font-size: 18px; font-weight: 500; opacity: 0.8; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #1e1e2e; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #cdd6f4; display: flex; overflow: hidden; position: relative;">

  <div style="width: 76px; flex-shrink: 0; background: #11111b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #313244;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #a6e3a1; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#cdd6f4"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon active" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #fab387; border: 2px solid #313244; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #11111b; cursor: pointer;">D</div>
  </div>

  <div style="flex: 1; box-sizing: border-box; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px; padding: 70px 0; display: flex; align-items: center; justify-content: center;">

    <div style="width: 640px; background: #313244; border: 3px solid #11111b; border-radius: 18px; box-shadow: 6px 6px 0 rgba(0,0,0,0.4); box-sizing: border-box; padding: 44px 48px 48px; display: flex; flex-direction: column; align-items: center;">

      <div class="game-card" style="background: #f5c2e7; color: #1e1e2e; margin-bottom: 28px;">
        <div class="artist">SNOW PATROL</div>
        <div class="year">2006</div>
        <div class="title">Chasing Cars</div>
      </div>

      <button class="btn-yt" style="margin-bottom: 20px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1e1e2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open on YouTube
      </button>

      <div style="display: flex; gap: 14px; width: 100%; margin-bottom: 28px;">
        <button class="btn-secondary-half">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
          Report
        </button>
        <button class="btn-ghost-red-half">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Remove from playlist
        </button>
      </div>

      <div style="width: 100%; height: 2px; background: #45475a; margin-bottom: 18px;"></div>

      <div style="font-size: 12px; color: #6c7086;">Added by Darius on Jan 20, 2025</div>

    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
