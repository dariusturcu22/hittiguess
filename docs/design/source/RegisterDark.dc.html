<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .bar { border-radius: 100px; }
    .authcard { width: 460px; background: #313244; border: 3px solid #11111b; border-radius: 18px; box-shadow: 6px 6px 0 rgba(0,0,0,0.4); box-sizing: border-box; padding: 44px 48px 48px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
    .toggle-wrap { display: flex; width: 100%; background: #1e1e2e; border: 2px solid #45475a; border-radius: 100px; padding: 5px; box-sizing: border-box; margin-bottom: 30px; }
    .toggle-opt { flex: 1; text-align: center; padding: 12px 0; border-radius: 100px; font-family: 'Bungee', sans-serif; font-size: 13px; box-sizing: border-box; }
    .toggle-opt.active { background: #fab387; color: #1e1e2e; box-shadow: 3px 3px 0 rgba(0,0,0,0.3); }
    .toggle-opt.inactive { color: #a6adc8; }
    .field-block { width: 100%; margin-bottom: 18px; }
    .field-label { font-size: 13px; font-weight: 600; color: #a6adc8; margin-bottom: 7px; display: block; }
    .field-input { width: 100%; box-sizing: border-box; background: #1e1e2e; border: 2px solid #45475a; border-radius: 13px; padding: 13px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #cdd6f4; }
    .field-input::placeholder { color: #6c7086; }
    .btn-auth { width: 100%; text-align: center; background: #fab387; color: #1e1e2e; font-family: 'Bungee', sans-serif; font-size: 15px; padding: 16px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: none; }
    .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #eff1f5; color: #11111b; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; padding: 14px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: 2px solid #45475a; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #1e1e2e; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #cdd6f4; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px;">

  <div style="position: absolute; top: -180px; right: -160px; width: 560px; height: 560px; border-radius: 50%; background: #cba6f7; opacity: 0.16; z-index: 1;"></div>
  <div style="position: absolute; bottom: -220px; left: -160px; width: 480px; height: 480px; background: #89b4fa; opacity: 0.14; transform: rotate(18deg); z-index: 1;"></div>

  <div class="authcard">

    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 30px;">
      <div style="display: flex; align-items: center; gap: 3px; height: 24px;">
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 11px;"></div>
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 22px;"></div>
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 15px;"></div>
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 24px;"></div>
      </div>
      <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #cdd6f4;">hittiguess</div>
    </div>

    <div class="toggle-wrap">
      <div class="toggle-opt inactive">Log in</div>
      <div class="toggle-opt active">Create account</div>
    </div>

    <div style="width: 100%; margin-bottom: 26px; text-align: center;">
      <div style="font-family: 'Bungee', sans-serif; font-size: 24px; color: #f5c2e7; text-shadow: 3px 3px 0 #1e1e2e; line-height: 1.1;">Join the game</div>
      <div style="font-size: 13px; color: #a6adc8; margin-top: 8px;">Create an account and start guessing.</div>
    </div>

    <div class="field-block">
      <label class="field-label">Name</label>
      <input class="field-input" type="text" placeholder="Darius">
    </div>

    <div class="field-block">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" placeholder="you@example.com">
    </div>

    <div class="field-block">
      <label class="field-label">Password</label>
      <input class="field-input" type="password" placeholder="••••••••••">
    </div>

    <div class="field-block" style="margin-bottom: 30px;">
      <label class="field-label">Confirm password</label>
      <input class="field-input" type="password" placeholder="••••••••••">
    </div>

    <button class="btn-auth">Create account</button>

    <div style="display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 24px;">
      <div style="flex: 1; height: 2px; background: #45475a;"></div>
      <div style="font-size: 12px; color: #6c7086;">or</div>
      <div style="flex: 1; height: 2px; background: #45475a;"></div>
    </div>

    <button class="btn-google" style="margin-top: 20px;">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"></path>
        <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"></path>
        <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"></path>
        <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"></path>
      </svg>
      Continue with Google
    </button>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
