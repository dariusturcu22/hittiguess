<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9ca0b0; }
    .navicon.active { background: #8f4fe3; box-shadow: 3px 3px 0 rgba(76,79,105,0.3); color: #ffffff; }
    .navicon.lobby-active { background: rgba(237,111,39,0.15); color: #ed6f27; box-shadow: 0 0 0 2px #ed6f27; }
    .divider { width: 32px; height: 2px; background: #ccd0da; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .btn-primary { font-family: 'Bungee', sans-serif; font-size: 13px; color: #ffffff; background: #ed6f27; padding: 12px 24px; border-radius: 100px; box-shadow: 4px 4px 0 rgba(76,79,105,0.3); box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: none; }
    .btn-secondary { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: #4c4f69; background: #ffffff; padding: 11px 20px; border-radius: 100px; border: 2px solid #ccd0da; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .sticker-card { border: 3px solid #4c4f69; border-radius: 18px; background: #ffffff; box-shadow: 6px 6px 0 rgba(76,79,105,0.25); box-sizing: border-box; }
    .podium-avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; color: #ffffff; flex-shrink: 0; }
    .rank-row { display: flex; align-items: center; gap: 16px; padding: 12px 8px; border-bottom: 2px solid #ccd0da; }
    .rank-row:last-child { border-bottom: none; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #eff1f5; display: flex; font-family: 'Space Grotesk', sans-serif;">

  <!-- LEFT SIDEBAR -->
  <div style="width: 76px; flex-shrink: 0; background: #e6e9ef; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #ccd0da;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #499f36; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon active" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #ed6f27; border: 2px solid #ccd0da; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #ffffff; cursor: pointer;">D</div>
  </div>

  <!-- MAIN CONTENT (wider, no voice sidebar) -->
  <div style="flex: 1; min-width: 0; padding: 40px 48px 50px; box-sizing: border-box; background-image: radial-gradient(circle, rgba(76,79,105,0.2) 1.5px, transparent 1.5px); background-size: 22px 22px; overflow: hidden; display: flex; flex-direction: column; align-items: center;">

    <!-- HEADER -->
    <div style="text-align: center;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="#d49032"><path d="M5 4h14v3a7 7 0 0 1-14 0V4z"></path><path d="M5 5H2v2a4 4 0 0 0 4 4M19 5h3v2a4 4 0 0 1-4 4"></path><rect x="9" y="14" width="6" height="4" fill="#d49032"></rect><rect x="6" y="18" width="12" height="3" rx="1" fill="#d49032"></rect></svg>
      <div style="font-family: 'Bungee', sans-serif; font-size: 36px; color: #4c4f69; margin-top: 12px; text-shadow: 3px 3px 0 rgba(76,79,105,0.25);">Game Over</div>
      <div style="font-size: 14px; color: #5c5f77; margin-top: 10px;">Midnight Radio — 10 rounds</div>
    </div>

    <!-- PODIUM -->
    <div style="display: flex; align-items: flex-end; gap: 20px; margin-top: 32px;">
      <div class="sticker-card" style="width: 170px; height: 190px; padding: 18px 14px; display: flex; flex-direction: column; align-items: center; background: #ffffff;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#9ca0b0"><path d="M12 2l2.5 6.5H21l-5.5 4L17.5 19 12 15l-5.5 4L8.5 12.5 3 8.5h6.5z"></path></svg>
        <div class="podium-avatar" style="width: 56px; height: 56px; font-size: 19px; background: #3772e6; margin-top: 8px;">M</div>
        <div style="font-weight: 700; font-size: 14px; color: #4c4f69; margin-top: 10px;">Mara</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 18px; color: #3772e6; margin-top: 6px;">310</div>
      </div>
      <div class="sticker-card" style="width: 180px; height: 230px; padding: 20px 14px; display: flex; flex-direction: column; align-items: center; background: #ffffff; border-color: #d49032;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#d49032"><path d="M5 4h14v3a7 7 0 0 1-14 0V4z"></path><path d="M5 5H2v2a4 4 0 0 0 4 4M19 5h3v2a4 4 0 0 1-4 4"></path><rect x="9" y="14" width="6" height="4" fill="#d49032"></rect><rect x="6" y="18" width="12" height="3" rx="1" fill="#d49032"></rect></svg>
        <div class="podium-avatar" style="width: 64px; height: 64px; font-size: 22px; background: #ed6f27; margin-top: 10px; box-shadow: 0 0 0 3px #d49032;">D</div>
        <div style="font-weight: 700; font-size: 15px; color: #4c4f69; margin-top: 12px;">Darius</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 22px; color: #d49032; margin-top: 8px;">420</div>
      </div>
      <div class="sticker-card" style="width: 170px; height: 170px; padding: 18px 14px; display: flex; flex-direction: column; align-items: center; background: #ffffff;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#ed6f27"><path d="M12 2l2.5 6.5H21l-5.5 4L17.5 19 12 15l-5.5 4L8.5 12.5 3 8.5h6.5z"></path></svg>
        <div class="podium-avatar" style="width: 56px; height: 56px; font-size: 19px; background: #d49032; margin-top: 8px;">T</div>
        <div style="font-weight: 700; font-size: 14px; color: #4c4f69; margin-top: 10px;">Theo</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 18px; color: #ed6f27; margin-top: 6px;">265</div>
      </div>
    </div>

    <!-- FULL RANKED LIST -->
    <div class="sticker-card" style="width: 560px; padding: 22px; margin-top: 28px; box-sizing: border-box;">
      <div class="rank-row">
        <div style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #d49032; width: 24px;">1</div>
        <div class="podium-avatar" style="width: 40px; height: 40px; font-size: 14px; background: #ed6f27;">D</div>
        <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Darius</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #4c4f69;">420</div>
      </div>
      <div class="rank-row">
        <div style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #5c5f77; width: 24px;">2</div>
        <div class="podium-avatar" style="width: 40px; height: 40px; font-size: 14px; background: #3772e6;">M</div>
        <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Mara</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #4c4f69;">310</div>
      </div>
      <div class="rank-row">
        <div style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #5c5f77; width: 24px;">3</div>
        <div class="podium-avatar" style="width: 40px; height: 40px; font-size: 14px; background: #d49032;">T</div>
        <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Theo</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #4c4f69;">265</div>
      </div>
      <div class="rank-row">
        <div style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #5c5f77; width: 24px;">4</div>
        <div class="podium-avatar" style="width: 40px; height: 40px; font-size: 14px; background: #e387cb;">L</div>
        <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Lena</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #4c4f69;">190</div>
      </div>
    </div>

    <!-- BOTTOM BUTTONS -->
    <div style="display: flex; align-items: center; gap: 18px; margin-top: 32px;">
      <div class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
        Play again
      </div>
      <div class="btn-secondary">Back to lobby</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
