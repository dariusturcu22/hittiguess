<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4c4f69; } a:hover { color: #8839ef; }

    .wave-bar { border-radius: 100px; width: 5px; }
  </style>
</helmet>
<div style="width: 560px; height: 760px; background: #eff1f5; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 28px; position: relative; overflow: hidden;">
  <div style="position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; border-radius: 50%; background: #8839ef; opacity: 0.9;"></div>
  <div style="position: absolute; bottom: -80px; left: -40px; width: 260px; height: 260px; background: #fe640b; transform: rotate(18deg); opacity: 0.85;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; z-index: 1;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 4px; height: 26px;">
        <div class="wave-bar" style="background: #40a02b; width: 6px; height: {{barB}};"></div>
        <div class="wave-bar" style="background: #40a02b; width: 6px; height: {{barD}};"></div>
        <div class="wave-bar" style="background: #40a02b; width: 6px; height: {{barA}};"></div>
        <div class="wave-bar" style="background: #40a02b; width: 6px; height: {{barC}};"></div>
      </div>
      <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: #4c4f69;">hittiguess</div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; background: #ccd0da; border-radius: 100px; padding: 4px;">
      <div style="width: 28px; height: 28px; border-radius: 50%; background: #eff1f5; display: flex; align-items: center; justify-content: center; color: #df8e1d;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>
      </div>
      <div style="width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #9ca0b0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </div>
    </div>
  </div>

  <div style="z-index: 1; display: flex; flex-direction: column; gap: 16px; margin-top: 12px;">
    <div style="font-family: 'Bungee', sans-serif; font-size: 56px; line-height: 1.02; color: #8839ef; text-shadow: 4px 4px 0 #ccd0da;">
      PLACE IT.<br>GUESS IT.<br>WIN IT.
    </div>
    <div style="font-size: 18px; color: #5c5f77; font-weight: 500; max-width: 380px;">
      The party game where being confidently wrong is half the fun. Songs, years, and your friends' terrible music takes.
    </div>
    <div style="margin-top: 8px;">
      <span style="display: inline-block; background: #fe640b; color: #eff1f5; font-family: 'Bungee', sans-serif; font-size: 16px; padding: 16px 32px; border-radius: 100px; transform: rotate(-2deg); box-shadow: 6px 6px 0 rgba(76,79,105,0.2);">
        START A SESSION
      </span>
    </div>
  </div>

  <div style="z-index: 1; margin-top: auto; display: flex; gap: 16px; align-items: flex-end;">
    <div style="width: 150px; height: 190px; background: #ffffff; border: 4px solid #bcc0cc; border-radius: 18px; transform: rotate(-6deg); box-shadow: 6px 6px 0 rgba(76,79,105,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <div style="width: 70%; height: 10px; background: #ccd0da; border-radius: 4px;"></div>
      <div style="font-family: 'Bungee', sans-serif; font-size: 34px; color: #40a02b;">'87</div>
      <div style="width: 50%; height: 10px; background: #ccd0da; border-radius: 4px;"></div>
    </div>
    <div style="width: 150px; height: 190px; background: #8839ef; border: 4px solid #4c4f69; border-radius: 18px; transform: rotate(4deg); box-shadow: 6px 6px 0 rgba(76,79,105,0.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <div style="width: 70%; height: 10px; background: rgba(239,241,245,0.35); border-radius: 4px;"></div>
      <div style="font-family: 'Bungee', sans-serif; font-size: 34px; color: #eff1f5;">?</div>
      <div style="width: 50%; height: 10px; background: rgba(239,241,245,0.35); border-radius: 4px;"></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  componentDidMount() {
    this.frame = 0;
    this.timer = setInterval(() => {
      this.frame += 1;
      this.forceUpdate();
    }, 120);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    var frame = this.frame || 0;
    var makeBarHeight = function (phase) {
      var value = 12 + Math.round(6 * Math.sin(frame * 0.35 + phase));
      return value + 'px';
    };
    return {
      barA: makeBarHeight(0),
      barB: makeBarHeight(1.6),
      barC: makeBarHeight(3.1),
      barD: makeBarHeight(4.7)
    };
  }
}
</script>
</body>
</html>
