<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9ca0b0; }
    .navicon.active { background: #8f4fe3; box-shadow: 3px 3px 0 rgba(76,79,105,0.3); color: #ffffff; }
    .navicon.lobby-active { background: rgba(237,111,39,0.15); color: #ed6f27; box-shadow: 0 0 0 2px #ed6f27; }
    .divider { width: 32px; height: 2px; background: #ccd0da; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .vavatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vavatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 17px; color: #11111b; }
    .vname { font-size: 10px; color: #5c5f77; max-width: 70px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vctrl { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-primary { font-family: 'Bungee', sans-serif; font-size: 13px; color: #ffffff; background: #ed6f27; padding: 12px 24px; border-radius: 100px; box-shadow: 4px 4px 0 rgba(76,79,105,0.3); box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: none; }
    .btn-secondary { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: #4c4f69; background: #ffffff; padding: 11px 20px; border-radius: 100px; border: 2px solid #ccd0da; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .btn-ghost-red { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: #d20f39; background: transparent; padding: 11px 20px; border-radius: 100px; border: 2px solid #ccd0da; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .sticker-card { border: 3px solid #4c4f69; border-radius: 18px; background: #ffffff; box-shadow: 6px 6px 0 rgba(76,79,105,0.25); box-sizing: border-box; }
    .pill-badge { border-radius: 100px; font-family: 'Bungee', sans-serif; font-size: 9px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 4px; }
    .player-row { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 2px solid #ccd0da; }
    .player-row:last-child { border-bottom: none; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #ccd0da; }
    .stat-row:last-child { border-bottom: none; }
  </style>
</helmet>
<div style="width: 1440px; height: 860px; box-sizing: border-box; background: #eff1f5; display: flex; font-family: 'Space Grotesk', sans-serif;">

  <!-- LEFT SIDEBAR -->
  <div style="width: 76px; flex-shrink: 0; background: #e6e9ef; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #ccd0da;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #499f36; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#4c4f69"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon lobby-active" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #ed6f27; border: 2px solid #ccd0da; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #ffffff; cursor: pointer;">D</div>
  </div>

  <!-- MAIN CONTENT -->
  <div style="flex: 1; min-width: 0; padding: 40px 48px; box-sizing: border-box; background-image: radial-gradient(circle, rgba(76,79,105,0.2) 1.5px, transparent 1.5px); background-size: 22px 22px; overflow: hidden;">

    <div style="font-family: 'Bungee', sans-serif; font-size: 32px; color: #4c4f69; text-shadow: 3px 3px 0 rgba(76,79,105,0.25);">Group Lobby</div>
    <div style="display: inline-flex; align-items: center; gap: 10px; background: #ffffff; border: 2px solid #ccd0da; border-radius: 100px; padding: 8px 16px 8px 8px; margin-top: 14px;">
      <div style="width: 26px; height: 26px; border-radius: 8px; background: #8f4fe3;"></div>
      <div style="font-weight: 600; font-size: 13px; color: #4c4f69;">Midnight Radio</div>
      <div style="width: 4px; height: 4px; border-radius: 50%; background: #9ca0b0;"></div>
      <div style="font-size: 12px; color: #5c5f77;">32 songs</div>
    </div>

    <div style="display: flex; gap: 28px; margin-top: 32px; align-items: flex-start;">

      <!-- LEFT COLUMN -->
      <div style="flex: 1.4; min-width: 0; display: flex; flex-direction: column; gap: 24px;">

        <div class="sticker-card" style="padding: 22px;">
          <div style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #499f36; margin-bottom: 6px;">Players (4)</div>

          <div class="player-row">
            <div style="width: 44px; height: 44px; border-radius: 50%; background: #ed6f27; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 15px; color: #ffffff;">D</div>
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-weight: 600; font-size: 14px; color: #4c4f69;">Darius</span>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="#d49032"><path d="M5 16L3 6l5.5 4L12 4l3.5 6L21 6l-2 10H5zm0 3h14v2H5v-2z"></path></svg>
              </div>
            </div>
            <div class="pill-badge" style="background: rgba(73,159,54,0.15); color: #499f36;">✓ READY</div>
          </div>

          <div class="player-row">
            <div style="width: 44px; height: 44px; border-radius: 50%; background: #3772e6; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 15px; color: #ffffff;">M</div>
            <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Mara</div>
            <div class="pill-badge" style="background: rgba(73,159,54,0.15); color: #499f36;">✓ READY</div>
          </div>

          <div class="player-row">
            <div style="width: 44px; height: 44px; border-radius: 50%; background: #d49032; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 15px; color: #ffffff;">T</div>
            <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Theo</div>
            <div class="pill-badge" style="background: rgba(156,160,176,0.2); color: #5c5f77;">WAITING</div>
          </div>

          <div class="player-row">
            <div style="width: 44px; height: 44px; border-radius: 50%; background: #e387cb; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 15px; color: #ffffff;">L</div>
            <div style="flex: 1; font-weight: 600; font-size: 14px; color: #4c4f69;">Lena</div>
            <div class="pill-badge" style="background: rgba(73,159,54,0.15); color: #499f36;">✓ READY</div>
          </div>
        </div>

        <div class="sticker-card" style="padding: 22px;">
          <div style="font-family: 'Bungee', sans-serif; font-size: 15px; color: #3772e6; margin-bottom: 10px;">Settings</div>
          <div class="stat-row">
            <div style="font-size: 13px; color: #5c5f77;">Rounds</div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="font-weight: 700; font-size: 14px; color: #4c4f69;">10</div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </div>
          </div>
          <div class="stat-row">
            <div style="font-size: 13px; color: #5c5f77;">Time per round</div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="font-weight: 700; font-size: 14px; color: #4c4f69;">45s</div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca0b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div style="flex: 1; min-width: 0;">
        <div class="sticker-card" style="padding: 26px; text-align: center;">
          <div style="font-family: 'Bungee', sans-serif; font-size: 14px; color: #e387cb; margin-bottom: 14px;">Invite players</div>
          <div style="font-family: 'Bungee', sans-serif; font-size: 40px; letter-spacing: 4px; color: #4c4f69; background: #eff1f5; border: 2px solid #ccd0da; border-radius: 14px; padding: 18px 10px; text-shadow: 3px 3px 0 rgba(76,79,105,0.2);">K7QX9J</div>
          <div style="margin-top: 18px;">
            <div class="btn-secondary" style="width: 100%; justify-content: center;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              Copy link
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 18px; margin-top: 32px;">
      <div class="btn-primary" style="font-size: 16px; padding: 18px 40px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"></path></svg>
        Start game
      </div>
      <div class="btn-ghost-red">Leave lobby</div>
    </div>
  </div>

  <!-- RIGHT VOICE SIDEBAR -->
  <div style="width: 100px; flex-shrink: 0; background: #e6e9ef; border-left: 3px solid #ccd0da; display: flex; flex-direction: column; align-items: center; padding: 22px 0 20px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
      <div class="vavatar-wrap">
        <div style="width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 0 3px #e6e9ef, 0 0 0 6px #499f36;">
          <div class="vavatar" style="background: #499f36; width: 100%; height: 100%; color: #ffffff;">D</div>
        </div>
        <div class="vname" style="color: #499f36;">Darius</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #3772e6; color: #ffffff;">M</div>
        <div class="vname">Mara</div>
      </div>
      <div class="vavatar-wrap">
        <div style="position: relative; width: 52px; height: 52px;">
          <div class="vavatar" style="background: #d49032; width: 100%; height: 100%; color: #ffffff;">T</div>
          <div style="position: absolute; inset: 0; border-radius: 50%; background: rgba(210,15,57,0.6); display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
              <g stroke="#ffffff" stroke-width="4.6"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M19 10v2a7 7 0 0 1-.11 1.23"></path><path d="M5 10v2a7 7 0 0 0 7 7 6.94 6.94 0 0 0 3.11-.72"></path><line x1="1" y1="1" x2="23" y2="23"></line></g>
              <g stroke="#d20f39" stroke-width="2.6"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M19 10v2a7 7 0 0 1-.11 1.23"></path><path d="M5 10v2a7 7 0 0 0 7 7 6.94 6.94 0 0 0 3.11-.72"></path><line x1="1" y1="1" x2="23" y2="23"></line></g>
            </svg>
          </div>
        </div>
        <div class="vname" style="color: #d20f39;">Theo</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #e387cb; color: #ffffff;">L</div>
        <div class="vname">Lena</div>
      </div>
    </div>
    <div style="flex: 1;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div class="vctrl" style="background: #ffffff; color: #4c4f69;" title="Mute">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"></path><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11h-2z"></path></svg>
      </div>
      <div class="vctrl" style="background: #ffffff; color: #4c4f69;" title="Deafen">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H6v-1a6 6 0 0 1 12 0v1h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"></path></svg>
      </div>
      <div class="divider" style="margin: 6px auto;"></div>
      <div class="vctrl" style="background: #d20f39;" title="Leave voice">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#eff1f5" style="transform: rotate(135deg);"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.11-.21 11.4 11.4 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.58 1 1 0 0 1-.25 1.02z"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
