<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .bar { border-radius: 100px; }
    .authcard { width: 460px; background: #313244; border: 3px solid #11111b; border-radius: 18px; box-shadow: 6px 6px 0 rgba(0,0,0,0.4); box-sizing: border-box; padding: 44px 48px 48px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
    .field-block { width: 100%; margin-bottom: 28px; }
    .field-label { font-size: 13px; font-weight: 600; color: #a6adc8; margin-bottom: 7px; display: block; }
    .field-input { width: 100%; box-sizing: border-box; background: #1e1e2e; border: 2px solid #45475a; border-radius: 13px; padding: 13px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #cdd6f4; }
    .field-input::placeholder { color: #6c7086; }
    .btn-auth { width: 100%; text-align: center; background: #fab387; color: #1e1e2e; font-family: 'Bungee', sans-serif; font-size: 15px; padding: 16px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: none; }
    .link-accent { color: #fab387; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #1e1e2e; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #cdd6f4; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px;">

  <div style="position: absolute; top: -180px; right: -160px; width: 560px; height: 560px; border-radius: 50%; background: #f9e2af; opacity: 0.14; z-index: 1;"></div>
  <div style="position: absolute; bottom: -220px; left: -160px; width: 480px; height: 480px; background: #cba6f7; opacity: 0.14; transform: rotate(18deg); z-index: 1;"></div>

  <div class="authcard">

    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 30px;">
      <div style="display: flex; align-items: center; gap: 3px; height: 24px;">
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 11px;"></div>
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 22px;"></div>
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 15px;"></div>
        <div class="bar" style="background: #a6e3a1; width: 5px; height: 24px;"></div>
      </div>
      <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #cdd6f4;">hittiguess</div>
    </div>

    <div style="width: 42px; height: 42px; border-radius: 50%; background: rgba(250,179,135,0.16); display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fab387" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>

    <div style="width: 100%; margin-bottom: 28px; text-align: center;">
      <div style="font-family: 'Bungee', sans-serif; font-size: 24px; color: #f5c2e7; text-shadow: 3px 3px 0 #1e1e2e; line-height: 1.1;">Forgot password?</div>
      <div style="font-size: 13px; color: #a6adc8; margin-top: 10px; line-height: 1.6; max-width: 340px;">No worries. Enter the email on your account and we'll send you a link to reset it.</div>
    </div>

    <div class="field-block">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" placeholder="you@example.com">
    </div>

    <button class="btn-auth" style="margin-bottom: 22px;">Send reset link</button>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #a6adc8;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a6adc8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span class="link-accent">Back to log in</span>
    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
