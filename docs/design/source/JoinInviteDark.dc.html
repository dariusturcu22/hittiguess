<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6c7086; }
    .navicon.active { background: #cba6f7; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); color: #11111b; }
    .divider { width: 32px; height: 2px; background: #313244; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .bar { border-radius: 100px; }
    .invitecard { width: 540px; background: #313244; border: 3px solid #11111b; border-radius: 18px; box-shadow: 6px 6px 0 rgba(0,0,0,0.4); box-sizing: border-box; padding: 40px 48px 44px; display: flex; flex-direction: column; align-items: center; }
    .btn-join { width: 100%; text-align: center; background: #fab387; color: #1e1e2e; font-family: 'Bungee', sans-serif; font-size: 15px; padding: 16px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: none; }
    .link-ghost { color: #a6adc8; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
    .mini-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 12px; color: #11111b; border: 3px solid #313244; box-sizing: border-box; }
    .mini-avatar.overflow { background: #45475a; color: #a6adc8; }
    .field-label { font-size: 11px; font-weight: 700; color: #a6adc8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 7px; display: block; }
    .field-input { width: 100%; box-sizing: border-box; background: #1e1e2e; border: 2px solid #45475a; border-radius: 13px; padding: 12px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #cdd6f4; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #1e1e2e; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #cdd6f4; display: flex; overflow: hidden; position: relative;">

  <div style="width: 76px; flex-shrink: 0; background: #11111b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #313244;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #a6e3a1; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#cdd6f4"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #fab387; border: 2px solid #313244; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #11111b; cursor: pointer;">D</div>
  </div>

  <div style="flex: 1; box-sizing: border-box; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px; display: flex; align-items: center; justify-content: center;">

    <div class="invitecard">

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 26px;">
        <div style="display: flex; align-items: center; gap: 3px; height: 24px;">
          <div class="bar" style="background: #a6e3a1; width: 5px; height: 11px;"></div>
          <div class="bar" style="background: #a6e3a1; width: 5px; height: 22px;"></div>
          <div class="bar" style="background: #a6e3a1; width: 5px; height: 15px;"></div>
          <div class="bar" style="background: #a6e3a1; width: 5px; height: 24px;"></div>
        </div>
        <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #cdd6f4;">hittiguess</div>
      </div>

      <div style="font-family: 'Bungee', sans-serif; font-size: 22px; color: #f5c2e7; text-shadow: 3px 3px 0 #1e1e2e; text-align: center; margin-bottom: 22px;">You're invited</div>

      <!-- PLAYLIST CARD -->
      <div style="width: 100%; background: #1e1e2e; border: 2px solid #45475a; border-radius: 16px; box-sizing: border-box; padding: 18px; display: flex; align-items: center; gap: 16px; margin-bottom: 22px;">
        <div style="width: 76px; height: 76px; border-radius: 16px; background: #cba6f7; border: 3px solid #11111b; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(17,17,27,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div style="min-width: 0; flex: 1;">
          <div style="font-family: 'Bungee', sans-serif; font-size: 20px; color: #cba6f7; text-shadow: 2px 2px 0 #313244;">Midnight Radio</div>
          <div style="font-size: 12.5px; color: #a6adc8; margin-top: 6px;">32 songs</div>
          <div style="display: flex; align-items: center; margin-top: 10px;">
            <div class="mini-avatar" style="background: #fab387; z-index: 4;">D</div>
            <div class="mini-avatar" style="background: #89b4fa; z-index: 3; margin-left: -10px;">M</div>
            <div class="mini-avatar" style="background: #f9e2af; z-index: 2; margin-left: -10px;">T</div>
            <div class="mini-avatar overflow" style="z-index: 1; margin-left: -10px;">+3</div>
          </div>
        </div>
      </div>

      <!-- PROFILE FOR THIS PLAYLIST -->
      <div style="width: 100%; margin-bottom: 24px;">
        <label class="field-label">Join as</label>
        <div style="display: flex; align-items: center; gap: 14px;">
          <div>
            <div style="position: relative; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 3px solid #11111b; cursor: pointer;">
              <div style="width: 100%; height: 100%; background: #a6e3a1; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 22px; color: #11111b;">D</div>
              <div style="position: absolute; inset: 0; background: radial-gradient(circle, rgba(17,17,27,0.85) 0%, rgba(17,17,27,0.55) 48%, rgba(17,17,27,0) 78%); display: flex; align-items: center; justify-content: center;">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cdd6f4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
              </div>
            </div>
            <div style="font-size: 9.5px; color: #6c7086; text-align: center; margin-top: 5px;">Hover to change</div>
          </div>
          <input class="field-input" type="text" value="Darius" style="flex: 1;">
        </div>
        <div style="font-size: 11px; color: #6c7086; margin-top: 8px; line-height: 1.5;">Defaults to your account name and picture. Change either one to join under a different identity just for this playlist.</div>
      </div>

      <button class="btn-join" style="margin-bottom: 16px;">Join playlist</button>

      <div class="link-ghost">Not now</div>

    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
