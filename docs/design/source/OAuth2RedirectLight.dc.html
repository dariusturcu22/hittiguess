<!doctype html>
<html>
<head>

  <script src="./support.js"></script>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .bar { border-radius: 100px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spinner-icon { animation: spin 1.1s linear infinite; transform-origin: center; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #eff1f5; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #4c4f69; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background-image: radial-gradient(circle, rgba(76,79,105,0.2) 1.5px, transparent 1.5px); background-size: 22px 22px;">

  <div style="position: absolute; top: -180px; right: -160px; width: 560px; height: 560px; border-radius: 50%; background: #e387cb; opacity: 0.12; z-index: 1;"></div>
  <div style="position: absolute; bottom: -220px; left: -160px; width: 480px; height: 480px; background: #8f4fe3; opacity: 0.1; transform: rotate(18deg); z-index: 1;"></div>

  <div style="display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2;">

    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 44px;">
      <div style="display: flex; align-items: center; gap: 3px; height: 24px;">
        <div class="bar" style="background: #499f36; width: 5px; height: 11px;"></div>
        <div class="bar" style="background: #499f36; width: 5px; height: 22px;"></div>
        <div class="bar" style="background: #499f36; width: 5px; height: 15px;"></div>
        <div class="bar" style="background: #499f36; width: 5px; height: 24px;"></div>
      </div>
      <div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 26px; color: #4c4f69;">hittiguess</div>
    </div>

    <svg class="spinner-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e387cb" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="34 20"></circle></svg>

    <div style="font-family: 'Bungee', sans-serif; font-size: 18px; color: #e387cb; margin-top: 22px; text-shadow: 2px 2px 0 #ccd0da;">Signing you in&hellip;</div>
    <div style="font-size: 13px; color: #5c5f77; margin-top: 10px;">Finishing up with your account provider. This only takes a second.</div>

  </div>

</div>
</x-dc>
