<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9ca0b0; }
    .navicon.active { background: #8f4fe3; box-shadow: 3px 3px 0 rgba(76,79,105,0.3); color: #ffffff; }
    .divider { width: 32px; height: 2px; background: #ccd0da; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .field-block { width: 100%; margin-bottom: 22px; }
    .field-label { font-size: 13px; font-weight: 600; color: #5c5f77; margin-bottom: 7px; display: block; }
    .field-input { width: 100%; box-sizing: border-box; background: #eff1f5; border: 2px solid #ccd0da; border-radius: 13px; padding: 13px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #4c4f69; }
    .field-input::placeholder { color: #9ca0b0; }
    .field-textarea { width: 100%; box-sizing: border-box; background: #eff1f5; border: 2px solid #ccd0da; border-radius: 13px; padding: 13px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #4c4f69; resize: none; height: 68px; }
    .color-swatch-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
    .btn-save { flex: 1; text-align: center; background: #ed6f27; color: #ffffff; font-family: 'Bungee', sans-serif; font-size: 14px; padding: 14px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(76,79,105,0.3); box-sizing: border-box; cursor: pointer; border: none; }
    .btn-cancel { flex: 1; text-align: center; background: transparent; color: #5c5f77; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; padding: 14px 0; border-radius: 100px; border: 2px solid #ccd0da; box-sizing: border-box; cursor: pointer; }
    .toggle-track { width: 44px; height: 24px; border-radius: 100px; background: #499f36; position: relative; flex-shrink: 0; }
    .toggle-knob { width: 18px; height: 18px; border-radius: 50%; background: #ffffff; position: absolute; top: 3px; right: 3px; }
  </style>
</helmet>
<div style="width: 1440px; height: 940px; background: #eff1f5; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #4c4f69; display: flex; overflow: hidden; position: relative;">

  <div style="width: 76px; flex-shrink: 0; background: #e6e9ef; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #ccd0da;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #499f36; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#4c4f69"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon active" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #ed6f27; border: 2px solid #ccd0da; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #ffffff; cursor: pointer;">D</div>
  </div>

  <div style="flex: 1; box-sizing: border-box; background-image: radial-gradient(circle, rgba(76,79,105,0.2) 1.5px, transparent 1.5px); background-size: 22px 22px; padding: 44px 0; display: flex; align-items: flex-start; justify-content: center;">

    <div style="width: 640px; background: #ffffff; border: 3px solid #4c4f69; border-radius: 18px; box-shadow: 6px 6px 0 rgba(76,79,105,0.25); box-sizing: border-box; padding: 44px 48px 48px; display: flex; flex-direction: column; align-items: center;">

      <div style="width: 100%; font-family: 'Bungee', sans-serif; font-size: 26px; color: #8f4fe3; text-shadow: 3px 3px 0 #ccd0da; text-align: center; margin-bottom: 24px;">Edit playlist</div>

      <div style="display: flex; align-items: center; gap: 18px; width: 100%; margin-bottom: 24px;">
        <div style="width: 90px; height: 90px; border-radius: 16px; background: #8f4fe3; border: 3px solid #4c4f69; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 8px; background: #eff1f5; border: 2px solid #ccd0da; color: #4c4f69; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; padding: 10px 18px; border-radius: 100px; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          Change cover
        </div>
      </div>

      <div class="field-block">
        <label class="field-label">Title</label>
        <input class="field-input" type="text" value="Midnight Radio">
      </div>

      <div class="field-block">
        <label class="field-label">Cover color</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="color-swatch-opt" style="background: #8f4fe3; box-shadow: 0 0 0 3px #ffffff, 0 0 0 5px #8f4fe3;"></div>
          <div class="color-swatch-opt" style="background: #ed6f27;"></div>
          <div class="color-swatch-opt" style="background: #499f36;"></div>
          <div class="color-swatch-opt" style="background: #3772e6;"></div>
          <div class="color-swatch-opt" style="background: #e387cb;"></div>
          <div class="color-swatch-opt" style="background: #d49032;"></div>
        </div>
      </div>

      <div class="field-block">
        <label class="field-label">Description</label>
        <textarea class="field-textarea">Late-night drives, city lights, and songs that sound better after midnight.</textarea>
      </div>

      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;">
        <div>
          <div style="font-size: 14px; color: #4c4f69; font-weight: 600;">Public playlist</div>
          <div style="font-size: 12px; color: #9ca0b0; margin-top: 3px;">Anyone can find and join this playlist.</div>
        </div>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
      </div>

      <div style="display: flex; gap: 12px; width: 100%; margin-bottom: 28px;">
        <button class="btn-save">Save changes</button>
        <button class="btn-cancel">Cancel</button>
      </div>

      <div style="width: 100%; height: 2px; background: #ccd0da; margin-bottom: 24px;"></div>

      <div style="width: 100%; background: rgba(210,15,57,0.05); border: 2px solid #d20f39; border-radius: 14px; box-sizing: border-box; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-size: 13px; color: #d20f39; font-weight: 600;">Delete this playlist</div>
          <div style="font-size: 11px; color: #5c5f77; margin-top: 3px;">This can't be undone. All songs and history will be lost.</div>
        </div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; color: #d20f39; background: transparent; padding: 9px 16px; border-radius: 100px; border: 2px solid #d20f39; box-sizing: border-box; cursor: pointer; white-space: nowrap;">Delete</div>
      </div>

    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
