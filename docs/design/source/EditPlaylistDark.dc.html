<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6c7086; }
    .navicon.active { background: #cba6f7; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); color: #11111b; }
    .divider { width: 32px; height: 2px; background: #313244; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .field-block { width: 100%; margin-bottom: 22px; }
    .field-label { font-size: 13px; font-weight: 600; color: #a6adc8; margin-bottom: 7px; display: block; }
    .field-input { width: 100%; box-sizing: border-box; background: #1e1e2e; border: 2px solid #45475a; border-radius: 13px; padding: 13px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #cdd6f4; }
    .field-input::placeholder { color: #6c7086; }
    .field-textarea { width: 100%; box-sizing: border-box; background: #1e1e2e; border: 2px solid #45475a; border-radius: 13px; padding: 13px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: #cdd6f4; resize: none; height: 68px; }
    .color-swatch-opt { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; flex-shrink: 0; }
    .btn-save { flex: 1; text-align: center; background: #fab387; color: #1e1e2e; font-family: 'Bungee', sans-serif; font-size: 14px; padding: 14px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: none; }
    .btn-cancel { flex: 1; text-align: center; background: transparent; color: #a6adc8; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; padding: 14px 0; border-radius: 100px; border: 2px solid #45475a; box-sizing: border-box; cursor: pointer; }
    .toggle-track { width: 44px; height: 24px; border-radius: 100px; background: #a6e3a1; position: relative; flex-shrink: 0; }
    .toggle-knob { width: 18px; height: 18px; border-radius: 50%; background: #11111b; position: absolute; top: 3px; right: 3px; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #1e1e2e; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #cdd6f4; display: flex; overflow: hidden; position: relative;">

  <div style="width: 76px; flex-shrink: 0; background: #11111b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #313244;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #a6e3a1; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#cdd6f4"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon active" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #fab387; border: 2px solid #313244; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #11111b; cursor: pointer;">D</div>
  </div>

  <div style="flex: 1; box-sizing: border-box; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px; padding: 30px 0; display: flex; align-items: center; justify-content: center;">

    <div style="width: 640px; background: #313244; border: 3px solid #11111b; border-radius: 18px; box-shadow: 6px 6px 0 rgba(0,0,0,0.4); box-sizing: border-box; padding: 44px 48px 48px; display: flex; flex-direction: column; align-items: center;">

      <div style="width: 100%; font-family: 'Bungee', sans-serif; font-size: 26px; color: #cba6f7; text-shadow: 3px 3px 0 #1e1e2e; text-align: center; margin-bottom: 24px;">Edit playlist</div>

      <div style="display: flex; align-items: center; gap: 18px; width: 100%; margin-bottom: 24px;">
        <div style="width: 90px; height: 90px; border-radius: 16px; background: #cba6f7; border: 3px solid #11111b; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(17,17,27,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div style="display: inline-flex; align-items: center; gap: 8px; background: #1e1e2e; border: 2px solid #45475a; color: #cdd6f4; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; padding: 10px 18px; border-radius: 100px; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          Change cover
        </div>
      </div>

      <div class="field-block">
        <label class="field-label">Title</label>
        <input class="field-input" type="text" value="Midnight Radio">
      </div>

      <div class="field-block">
        <label class="field-label">Cover color</label>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="color-swatch-opt" style="background: #cba6f7; box-shadow: 0 0 0 3px #313244, 0 0 0 5px #cba6f7;"></div>
          <div class="color-swatch-opt" style="background: #fab387;"></div>
          <div class="color-swatch-opt" style="background: #a6e3a1;"></div>
          <div class="color-swatch-opt" style="background: #89b4fa;"></div>
          <div class="color-swatch-opt" style="background: #f5c2e7;"></div>
          <div class="color-swatch-opt" style="background: #f9e2af;"></div>
        </div>
      </div>

      <div class="field-block">
        <label class="field-label">Description</label>
        <textarea class="field-textarea">Late-night drives, city lights, and songs that sound better after midnight.</textarea>
      </div>

      <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px;">
        <div>
          <div style="font-size: 14px; color: #cdd6f4; font-weight: 600;">Public playlist</div>
          <div style="font-size: 12px; color: #6c7086; margin-top: 3px;">Anyone can find and join this playlist.</div>
        </div>
        <div class="toggle-track"><div class="toggle-knob"></div></div>
      </div>

      <div style="display: flex; gap: 12px; width: 100%; margin-bottom: 28px;">
        <button class="btn-save">Save changes</button>
        <button class="btn-cancel">Cancel</button>
      </div>

      <div style="width: 100%; height: 2px; background: #45475a; margin-bottom: 24px;"></div>

      <div style="width: 100%; background: rgba(231,130,132,0.08); border: 2px solid #e78284; border-radius: 14px; box-sizing: border-box; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-size: 13px; color: #e78284; font-weight: 600;">Delete this playlist</div>
          <div style="font-size: 11px; color: #a6adc8; margin-top: 3px;">This can't be undone. All songs and history will be lost.</div>
        </div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12px; color: #e78284; background: transparent; padding: 9px 16px; border-radius: 100px; border: 2px solid #e78284; box-sizing: border-box; cursor: pointer; white-space: nowrap;">Delete</div>
      </div>

    </div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
