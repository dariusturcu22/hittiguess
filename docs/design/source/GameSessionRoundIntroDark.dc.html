<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6c7086; }
    .navicon.active { background: #cba6f7; box-shadow: 3px 3px 0 rgba(0,0,0,0.4); color: #11111b; }
    .divider { width: 32px; height: 2px; background: #313244; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .vavatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vavatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 17px; color: #11111b; }
    .vname { font-size: 10px; color: #a6adc8; max-width: 70px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vctrl { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    @keyframes ringPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .ring-pulse { animation: ringPulse 1s ease-in-out infinite; }
    @keyframes roleFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .role-float { animation: roleFloat 3s ease-in-out infinite; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1e1e2e; display: flex; font-family: 'Space Grotesk', sans-serif;">

  <!-- LEFT SIDEBAR -->
  <div style="width: 76px; flex-shrink: 0; background: #11111b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #313244;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #a6e3a1; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon active" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#11111b"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #a6e3a1; border: 2px solid #313244; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #11111b; cursor: pointer;">D</div>
  </div>

  <!-- MAIN CONTENT -->
  <div style="flex: 1; min-width: 0; padding: 36px 56px 40px; box-sizing: border-box; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden;">

    <div style="font-weight: 700; font-size: 13px; letter-spacing: 4px; color: #6c7086; text-transform: uppercase; margin-bottom: 18px;">First to 8 cards wins</div>
    <div style="font-family: 'Bungee', sans-serif; font-size: 72px; color: #cdd6f4; text-shadow: 5px 5px 0 rgba(0,0,0,0.4); margin-bottom: 44px;">Round 1</div>

    <!-- COUNTDOWN RING -->
    <div class="ring-pulse" style="position: relative; width: 140px; height: 140px; margin-bottom: 48px;">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="60" fill="none" stroke="#313244" stroke-width="10"></circle>
        <circle cx="70" cy="70" r="60" fill="none" stroke="#fab387" stroke-width="10" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="151" transform="rotate(-90 70 70)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 48px; color: #cdd6f4;">3</div>
    </div>

    <!-- DJ / TURN ANNOUNCEMENT -->
    <div style="display: flex; align-items: center; gap: 56px;">
      <div class="role-float" style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
        <div style="font-weight: 700; font-size: 12px; letter-spacing: 3px; color: #cba6f7; text-transform: uppercase;">First DJ</div>
        <div style="width: 88px; height: 88px; border-radius: 50%; box-shadow: 0 0 0 4px #1e1e2e, 0 0 0 9px #cba6f7;">
          <div class="vavatar" style="background: #a6e3a1; width: 100%; height: 100%; font-size: 28px;">D</div>
        </div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 20px; color: #cdd6f4;">Darius</div>
      </div>

      <div style="width: 2px; height: 90px; background: #313244;"></div>

      <div class="role-float" style="display: flex; flex-direction: column; align-items: center; gap: 14px; animation-delay: -1.5s;">
        <div style="font-weight: 700; font-size: 12px; letter-spacing: 3px; color: #fab387; text-transform: uppercase;">First turn</div>
        <div style="width: 88px; height: 88px; border-radius: 50%; box-shadow: 0 0 0 4px #1e1e2e, 0 0 0 9px #fab387;">
          <div class="vavatar" style="background: #89b4fa; width: 100%; height: 100%; font-size: 28px;">M</div>
        </div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 20px; color: #cdd6f4;">Mara</div>
      </div>
    </div>

  </div>

  <!-- RIGHT VOICE SIDEBAR -->
  <div style="width: 100px; flex-shrink: 0; background: #181825; border-left: 3px solid #313244; display: flex; flex-direction: column; align-items: center; padding: 22px 0 20px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
      <div class="vavatar-wrap">
        <div style="width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 0 3px #181825, 0 0 0 6px #a6e3a1;">
          <div class="vavatar" style="background: #a6e3a1; width: 100%; height: 100%;">D</div>
        </div>
        <div class="vname" style="color: #a6e3a1;">Darius</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #89b4fa;">M</div>
        <div class="vname">Mara</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #f9e2af;">T</div>
        <div class="vname">Theo</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #f5c2e7;">L</div>
        <div class="vname">Lena</div>
      </div>
    </div>
    <div style="flex: 1;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div class="vctrl" style="background: #313244; color: #cdd6f4;" title="Mute">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"></path><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11h-2z"></path></svg>
      </div>
      <div class="vctrl" style="background: #313244; color: #cdd6f4;" title="Deafen">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H6v-1a6 6 0 0 1 12 0v1h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"></path></svg>
      </div>
      <div class="divider" style="margin: 6px auto;"></div>
      <div class="vctrl" style="background: #e78284;" title="Leave voice">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#1e1e2e" style="transform: rotate(135deg);"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.11-.21 11.4 11.4 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.58 1 1 0 0 1-.25 1.02z"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
