<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6c7086; }
    .navicon.lobby-active { background: rgba(250,179,135,0.18); color: #fab387; box-shadow: 0 0 0 2px #fab387; }
    .divider { width: 32px; height: 2px; background: #313244; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .vavatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vavatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 17px; color: #11111b; }
    .vname { font-size: 10px; color: #a6adc8; max-width: 70px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lobby-btn { display: inline-flex; align-items: center; gap: 9px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; color: #cdd6f4; background: #313244; border: 2px solid #45475a; border-radius: 100px; padding: 13px 22px; cursor: pointer; box-sizing: border-box; }
    .lobby-btn.primary { font-family: 'Bungee', sans-serif; font-size: 13px; color: #1e1e2e; background: #fab387; border: none; box-shadow: 4px 4px 0 rgba(0,0,0,0.4); }
    .lobby-btn.danger { color: #e78284; border-color: #e78284; background: transparent; }
    .orbit-slot { position: absolute; }
    @keyframes driftA { 0%, 100% { transform: translate(0,0); } 33% { transform: translate(6px,-5px); } 66% { transform: translate(-5px,4px); } }
    @keyframes driftB { 0%, 100% { transform: translate(0,0); } 33% { transform: translate(-6px,4px); } 66% { transform: translate(5px,-6px); } }
    @keyframes driftC { 0%, 100% { transform: translate(0,0); } 40% { transform: translate(4px,6px); } 70% { transform: translate(-6px,-4px); } }
    .drift-a { animation: driftA 7s ease-in-out infinite; }
    .drift-b { animation: driftB 8s ease-in-out infinite; animation-delay: -1.2s; }
    .drift-c { animation: driftC 6.5s ease-in-out infinite; animation-delay: -2.6s; }
    .drift-d { animation: driftA 7.5s ease-in-out infinite reverse; animation-delay: -0.6s; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid #45475a; }
    .stat-row:last-child { border-bottom: none; }
    .btn-save { flex: 1; text-align: center; background: #fab387; color: #1e1e2e; font-family: 'Bungee', sans-serif; font-size: 13px; padding: 13px 0; border-radius: 100px; box-shadow: 4px 4px 0 rgba(0,0,0,0.35); box-sizing: border-box; cursor: pointer; border: none; }
    .btn-cancel { flex: 1; text-align: center; background: transparent; color: #a6adc8; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; padding: 13px 0; border-radius: 100px; border: 2px solid #45475a; box-sizing: border-box; cursor: pointer; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #1e1e2e; display: flex; font-family: 'Space Grotesk', sans-serif; position: relative;">

  <!-- LEFT SIDEBAR -->
  <div style="width: 76px; flex-shrink: 0; background: #11111b; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #313244;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #a6e3a1; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #a6e3a1; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>
    <div class="divider"></div>
    <div class="navicon" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#cdd6f4"><path d="M8 5v14l11-7z"></path></svg>
    </div>
    <div class="divider"></div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>
    <div class="divider"></div>
    <div class="navicon lobby-active" title="Group lobby">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>
    <div style="flex: 1;"></div>
    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </div>
    <div style="height: 16px;"></div>
    <div style="width: 44px; height: 44px; border-radius: 50%; background: #fab387; border: 2px solid #313244; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #11111b; cursor: pointer;">D</div>
  </div>

  <!-- MAIN CONTENT -->
  <div style="flex: 1; min-width: 0; padding: 36px 56px 40px; box-sizing: border-box; background-image: radial-gradient(circle, rgba(108,112,134,0.25) 1.5px, transparent 1.5px); background-size: 22px 22px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="font-family: 'Bungee', sans-serif; font-size: 32px; color: #cdd6f4; text-shadow: 3px 3px 0 rgba(0,0,0,0.4);">Group Lobby</div>
      <div style="display: inline-flex; align-items: center; gap: 10px; background: #313244; border: 2px solid #45475a; border-radius: 100px; padding: 8px 16px 8px 8px;">
        <div style="width: 26px; height: 26px; border-radius: 8px; background: #cba6f7;"></div>
        <div style="font-weight: 600; font-size: 13px; color: #cdd6f4;">Midnight Radio</div>
        <div style="width: 4px; height: 4px; border-radius: 50%; background: #6c7086;"></div>
        <div style="font-size: 12px; color: #a6adc8;">32 songs</div>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; position: relative;">

      <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center;">
        <div style="font-weight: 700; font-size: 12px; letter-spacing: 3px; color: #6c7086; text-transform: uppercase; margin-bottom: 16px;">Enter code to join</div>
        <div style="font-family: 'Bungee', sans-serif; font-size: 76px; letter-spacing: 18px; color: #cdd6f4; text-shadow: 5px 5px 0 rgba(0,0,0,0.4); padding-left: 18px;">KQXJ</div>
        <div style="margin-top: 20px; display: inline-flex; align-items: center; gap: 9px; cursor: pointer; color: #a6adc8; font-weight: 600; font-size: 13px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy invite link
        </div>
      </div>

      <div class="orbit-slot" style="top: calc(50% - 115px); left: calc(50% - 210px); transform: translate(-50%,-50%) rotate(-7deg);">
        <div class="drift-a">
          <div class="vavatar-wrap">
            <div style="position: relative;">
              <div class="vavatar" style="background: #fab387; width: 68px; height: 68px; font-size: 23px; box-shadow: 0 0 0 3px #1e1e2e, 0 0 0 6px #a6e3a1;">D</div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#f9e2af" style="position: absolute; top: -7px; right: -7px; filter: drop-shadow(1px 1px 0 #1e1e2e);"><path d="M3 19h18l-1.8-9-5.2 4-3-7.5-3 7.5-5.2-4z"></path></svg>
            </div>
            <div style="font-weight: 600; font-size: 13px; color: #cdd6f4; margin-top: 6px;">Darius</div>
          </div>
        </div>
      </div>
      <div class="orbit-slot" style="top: calc(50% - 155px); left: calc(50% + 195px); transform: translate(-50%,-50%) rotate(5deg);">
        <div class="drift-b">
          <div class="vavatar-wrap">
            <div class="vavatar" style="background: #89b4fa; width: 68px; height: 68px; font-size: 23px; box-shadow: 0 0 0 3px #1e1e2e, 0 0 0 6px #a6e3a1;">M</div>
            <div style="font-weight: 600; font-size: 13px; color: #cdd6f4; margin-top: 6px;">Mara</div>
          </div>
        </div>
      </div>
      <div class="orbit-slot" style="top: calc(50% + 145px); left: calc(50% - 165px); transform: translate(-50%,-50%) rotate(6deg);">
        <div class="drift-c">
          <div class="vavatar-wrap">
            <div class="vavatar" style="background: #f9e2af; width: 68px; height: 68px; font-size: 23px; box-shadow: 0 0 0 3px #1e1e2e, 0 0 0 6px #45475a;">T</div>
            <div style="font-weight: 600; font-size: 13px; color: #cdd6f4; margin-top: 6px;">Theo</div>
          </div>
        </div>
      </div>
      <div class="orbit-slot" style="top: calc(50% + 125px); left: calc(50% + 235px); transform: translate(-50%,-50%) rotate(-5deg);">
        <div class="drift-d">
          <div class="vavatar-wrap">
            <div class="vavatar" style="background: #f5c2e7; width: 68px; height: 68px; font-size: 23px; box-shadow: 0 0 0 3px #1e1e2e, 0 0 0 6px #a6e3a1;">L</div>
            <div style="font-weight: 600; font-size: 13px; color: #cdd6f4; margin-top: 6px;">Lena</div>
          </div>
        </div>
      </div>

      <!-- SETTINGS POPUP, anchored above the Settings button -->
      <div style="position: absolute; left: 330px; bottom: 28px; width: 400px; background: #313244; border: 3px solid #11111b; border-radius: 18px; box-shadow: 6px 6px 0 rgba(0,0,0,0.4); box-sizing: border-box; padding: 26px 28px;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
          <div style="font-family: 'Bungee', sans-serif; font-size: 18px; color: #cdd6f4;">Settings</div>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>

        <div class="stat-row">
          <div style="font-size: 13px; color: #a6adc8;">Playlist</div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-weight: 700; font-size: 14px; color: #cdd6f4;">Midnight Radio</div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6c7086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </div>
        </div>
        <div class="stat-row">
          <div style="font-size: 13px; color: #a6adc8;">DJ mode</div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-weight: 700; font-size: 14px; color: #cdd6f4;">Rotating</div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6c7086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </div>
        </div>
        <div class="stat-row">
          <div style="font-size: 13px; color: #a6adc8;">Cards to win</div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="font-weight: 700; font-size: 14px; color: #cdd6f4;">8</div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6c7086" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 22px;">
          <button class="btn-save">Save changes</button>
          <button class="btn-cancel">Close</button>
        </div>

      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; flex-shrink: 0;">
      <div class="lobby-btn primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="#1e1e2e"><path d="M8 5v14l11-7z"></path></svg>Start game</div>
      <div class="lobby-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Chat
      </div>
      <div class="lobby-btn" style="color: #a6e3a1; border-color: #a6e3a1;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Settings
      </div>
      <div style="flex: 1;"></div>
      <div class="lobby-btn danger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Leave lobby
      </div>
    </div>
  </div>

  <!-- RIGHT VOICE SIDEBAR -->
  <div style="width: 100px; flex-shrink: 0; background: #181825; border-left: 3px solid #313244; display: flex; flex-direction: column; align-items: center; padding: 22px 0 20px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #89b4fa;">M</div>
        <div class="vname">Mara</div>
      </div>
      <div class="vavatar-wrap">
        <div style="position: relative; width: 52px; height: 52px;">
          <div class="vavatar" style="background: #f9e2af; width: 100%; height: 100%;">T</div>
          <div style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(231,130,132,0.88) 0%, rgba(231,130,132,0.55) 65%, rgba(231,130,132,0.4) 100%); display: flex; align-items: center; justify-content: center;">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M19 10v2a7 7 0 0 1-.11 1.23"></path><path d="M5 10v2a7 7 0 0 0 7 7 6.94 6.94 0 0 0 3.11-.72"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </div>
        </div>
        <div class="vname" style="color: #e78284;">Theo</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #f5c2e7;">L</div>
        <div class="vname">Lena</div>
      </div>
      <div class="vavatar-wrap" style="cursor: pointer;">
        <div style="width: 52px; height: 52px; border-radius: 50%; border: 2px dashed #6c7086; display: flex; align-items: center; justify-content: center; color: #a6e3a1; box-sizing: border-box;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        </div>
        <div class="vname" style="color: #a6e3a1;">Join call</div>
      </div>
    </div>
    <div style="flex: 1;"></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
