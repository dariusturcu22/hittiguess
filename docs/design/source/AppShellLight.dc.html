<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .navicon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #9ca0b0; }
    .navicon.active { background: #8f4fe3; box-shadow: 3px 3px 0 rgba(76,79,105,0.3); color: #eff1f5; }
    .navicon.lobby-active { background: rgba(237,111,39,0.14); color: #ed6f27; box-shadow: 0 0 0 2px #ed6f27; }
    .divider { width: 32px; height: 2px; background: #ccd0da; border-radius: 2px; margin: 14px auto; flex-shrink: 0; }
    .vavatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .vavatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 17px; color: #eff1f5; }
    .vname { font-size: 10px; color: #5c5f77; max-width: 70px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vctrl { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  </style>
</helmet>
<div style="width: 1440px; height: 920px; background: #eff1f5; font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; color: #4c4f69; display: flex; overflow: hidden; position: relative;">

  <div style="width: 76px; flex-shrink: 0; background: #e6e9ef; display: flex; flex-direction: column; align-items: center; padding: 20px 0; box-sizing: border-box; border-right: 3px solid #ccd0da;">
    <div style="display: flex; align-items: center; gap: 2px; height: 22px;">
      <div style="background: #499f36; width: 5px; height: 10px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 20px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 14px; border-radius: 100px;"></div>
      <div style="background: #499f36; width: 5px; height: 22px; border-radius: 100px;"></div>
    </div>

    <div class="divider"></div>

    <div class="navicon active" title="Play / start a session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#eff1f5"><path d="M8 5v14l11-7z"></path></svg>
    </div>

    <div class="divider"></div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div class="navicon" title="Your playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="13" y2="6"></line><line x1="4" y1="12" x2="13" y2="12"></line><line x1="4" y1="18" x2="9" y2="18"></line><circle cx="18" cy="16" r="2.3"></circle><path d="M20.3 16V6.5l-2.8 1"></path></svg>
      </div>
      <div class="navicon" title="Explore public playlists">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13 13 8.5 15.5 11 11" fill="currentColor" stroke-linejoin="round"></polygon></svg>
      </div>
    </div>

    <div class="divider"></div>

    <div class="navicon lobby-active" title="Group lobby — active session">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
    </div>

    <div style="flex: 1;"></div>

    <div class="navicon" title="Theme">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line></svg>
    </div>

    <div style="height: 16px;"></div>

    <div style="width: 44px; height: 44px; border-radius: 50%; background: #ed6f27; border: 2px solid #ccd0da; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #eff1f5; cursor: pointer;">D</div>
  </div>

  <div style="position: absolute; left: 92px; bottom: 20px; width: 290px; background: #ffffff; border: 3px solid #4c4f69; border-radius: 18px; box-shadow: 6px 6px 0 rgba(76,79,105,0.25); z-index: 5; box-sizing: border-box; overflow: hidden;">
    <div style="background: rgba(237,111,39,0.18); padding: 16px; display: flex; align-items: flex-start; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #ed6f27; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; font-size: 16px; color: #eff1f5; flex-shrink: 0;">D</div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
        <div style="font-family: 'Bungee', sans-serif; font-size: 16px; color: #4c4f69;">Darius</div>
        <div style="align-self: flex-start; margin-left: 0; background: #4c4f69; color: #ed6f27; font-family: 'Bungee', sans-serif; font-size: 8px; padding: 2px 7px; border-radius: 100px; cursor: pointer; white-space: nowrap;">View profile</div>
      </div>
      <div style="display: flex; gap: 6px; flex-shrink: 0;">
        <div style="width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #5c5f77;" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
        <div style="width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #d20f39;" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </div>
      </div>
    </div>
    <div style="height: 2px; background: #ccd0da;"></div>
    <div style="display: flex; padding: 14px 4px;">
      <div style="flex: 1; text-align: center;">
        <div style="font-family: 'Bungee', sans-serif; font-size: 19px; color: #ed6f27;">24</div>
        <div style="font-size: 10px; color: #9ca0b0; margin-top: 3px;">Games</div>
      </div>
      <div style="width: 2px; background: #ccd0da;"></div>
      <div style="flex: 1; text-align: center;">
        <div style="font-family: 'Bungee', sans-serif; font-size: 19px; color: #499f36;">62%</div>
        <div style="font-size: 10px; color: #9ca0b0; margin-top: 3px;">Win rate</div>
      </div>
      <div style="width: 2px; background: #ccd0da;"></div>
      <div style="flex: 1; text-align: center;">
        <div style="font-family: 'Bungee', sans-serif; font-size: 19px; color: #e387cb;">5</div>
        <div style="font-size: 10px; color: #9ca0b0; margin-top: 3px;">Streak</div>
      </div>
    </div>
  </div>

  <div style="flex: 1; box-sizing: border-box; background-image: radial-gradient(circle, rgba(76,79,105,0.2) 1.5px, transparent 1.5px); background-size: 22px 22px;"></div>

  <div style="width: 100px; flex-shrink: 0; background: #e6e9ef; border-left: 3px solid #ccd0da; display: flex; flex-direction: column; align-items: center; padding: 22px 0 20px; box-sizing: border-box;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 24px;">
      <div class="vavatar-wrap">
        <div style="width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 0 0 3px #e6e9ef, 0 0 0 6px #499f36;">
          <div class="vavatar" style="background: #499f36; width: 100%; height: 100%;">D</div>
        </div>
        <div class="vname" style="color: #499f36;">Darius</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #3772e6;">M</div>
        <div class="vname">Mara</div>
      </div>
      <div class="vavatar-wrap">
        <div style="position: relative; width: 52px; height: 52px;">
          <div class="vavatar" style="background: #d49032; width: 100%; height: 100%;">T</div>
          <div style="position: absolute; inset: 0; border-radius: 50%; background: rgba(210,15,57,0.6); display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-linecap="round">
              <g stroke="#ffffff" stroke-width="4.6"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M19 10v2a7 7 0 0 1-.11 1.23"></path><path d="M5 10v2a7 7 0 0 0 7 7 6.94 6.94 0 0 0 3.11-.72"></path><line x1="1" y1="1" x2="23" y2="23"></line></g>
              <g stroke="#d20f39" stroke-width="2.6"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M19 10v2a7 7 0 0 1-.11 1.23"></path><path d="M5 10v2a7 7 0 0 0 7 7 6.94 6.94 0 0 0 3.11-.72"></path><line x1="1" y1="1" x2="23" y2="23"></line></g>
            </svg>
          </div>
        </div>
        <div class="vname" style="color: #d20f39;">Theo</div>
      </div>
      <div class="vavatar-wrap">
        <div class="vavatar" style="background: #e387cb;">L</div>
        <div class="vname">Lena</div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div class="vctrl" style="background: #ffffff; border: 2px solid #ccd0da; color: #4c4f69;" title="Mute">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"></path><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11h-2z"></path></svg>
      </div>
      <div class="vctrl" style="background: #ffffff; border: 2px solid #ccd0da; color: #4c4f69;" title="Deafen">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H6v-1a6 6 0 0 1 12 0v1h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"></path></svg>
      </div>
      <div class="divider" style="margin: 6px auto;"></div>
      <div class="vctrl" style="background: #d20f39;" title="Leave voice">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="#eff1f5" style="transform: rotate(135deg);"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.11-.21 11.4 11.4 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.58 1 1 0 0 1-.25 1.02z"></path></svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {}
</script>
</body>
</html>
