# Database
spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
# Flyway
# baseline-on-migrate lets Flyway adopt an existing database (production) at
# baseline-version without re-running V1, since that schema already exists;
# a fresh database (no tables yet) runs every migration from V1 as normal.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Analytics store (story 33): a separate append-heavy Postgres instance for
# usage/event data, migrated and queried independently of the transactional
# database and its Flyway history above.
analytics.datasource.url=${ANALYTICS_DB_URL}
analytics.datasource.username=${ANALYTICS_DB_USERNAME:}
analytics.datasource.password=${ANALYTICS_DB_PASSWORD:}
analytics.retention.days=180
# AI microservice
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.internal-api-key=${INTERNAL_SERVICE_API_KEY}
# Catalog seeding: the admin backlog drain resolves at most this many pending
# imports per scheduled run, pacing against the chosen LLM tier's daily free
# quota (story 20). Overridable per environment.
catalog.seeding.daily-drain-quota=${CATALOG_SEEDING_DAILY_DRAIN_QUOTA:200}
# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000
# Short-lived token issued mid-login for a twoFactorEnabled account, submitted back to
# /auth/2fa/verify to complete login. Five minutes is long enough to read a code off an
# authenticator app, short enough that a leaked pending token is useless soon after.
jwt.two-factor-pending-expiration=300000
# Email (Resend, story 50): inactive, a safe degrade-to-logging, until RESEND_API_KEY is
# set. See EmailService and .env.example.
resend.api-key=${RESEND_API_KEY:}
resend.from-address=${EMAIL_FROM_ADDRESS:onboarding@resend.dev}
# Email verification and password-reset tokens are opaque, single-use, and expire after
# these windows (milliseconds, matching the jwt.expiration convention above).
email.verification-token-expiration=86400000
email.password-reset-token-expiration=3600000
# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# OAuth2 redirect
app.oauth2.redirect-uri=${FRONTEND_URL}/oauth2/redirect
# Email verification and password-reset links point here; the actual pages are story 28's
# frontend work, deferred, but the backend-issued link already has a stable shape to land on.
frontend.url=${FRONTEND_URL}
server.forward-headers-strategy=native
# Environment
# app.env and spring.profiles.active share the same underlying value so
# EnvironmentGuard's profile check and CookieUtil's existing app.env check
# always agree on whether the application is running against Production.
app.env=${APP_ENV:dev}
spring.profiles.active=${APP_ENV:dev}
# Actuator: health and Prometheus metrics endpoints
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
# OpenTelemetry: disabled by default (a safe no-op), enabled by setting OTEL_SDK_DISABLED=false
# alongside OTEL_EXPORTER_OTLP_ENDPOINT once a real collector or Grafana Cloud Tempo exists.
otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
otel.service.name=hittiguess-backend
# Sentry: inactive until SENTRY_DSN is set, per the Sentry SDK's own default no-op behavior.
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
# Voice (story 12): the ICE servers a client feeds RTCPeerConnection. STUN is always
# handed out. Cloudflare TURN is added as a fallback only when both a key id and an API
# token are configured; absent either, credentials come back STUN-only with
# turnAvailable=false, and the actual Cloudflare mint stays deferred until a key exists.
voice.turn.stun-url=${VOICE_TURN_STUN_URL:stun:stun.cloudflare.com:3478}
voice.turn.cloudflare.key-id=${VOICE_TURN_CLOUDFLARE_KEY_ID:}
voice.turn.cloudflare.api-token=${VOICE_TURN_CLOUDFLARE_API_TOKEN:}
